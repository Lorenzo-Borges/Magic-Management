<div class="cadastro-container">
  <h2>{{ editandoId ? 'Editar Tutorial' : 'Cadastro de Tutoriais' }}</h2>
  <form (ngSubmit)="salvar()" #form="ngForm" class="form-box">
    <div class="campo"><label>Modo de Jogo:</label><input type="text" name="modoJogo" [(ngModel)]="novoTutorial.modoJogo" required></div>
    <div class="campo"><label>Descrição:</label><textarea name="descricao" [(ngModel)]="novoTutorial.descricao" rows="4" required></textarea></div>
    <div class="botoes-form">
      <button type="submit" class="btn btn-salvar" [disabled]="!form.valid">{{ editandoId ? 'Atualizar' : 'Salvar' }}</button>
      <button type="button" class="btn btn-cancelar" *ngIf="editandoId" (click)="cancelarEdicao()">Cancelar</button>
    </div>
  </form>

  <ul class="lista-itens">
    <li *ngFor="let tut of listaTutoriais" class="item-card">
      <div class="item-info">
        <h4>{{ tut.id }} - {{ tut.modoJogo }}</h4>
        <p>{{ tut.descricao }}</p>
      </div>
      <div class="item-acoes">
        <button type="button" class="btn btn-editar" (click)="editar(tut)">Editar</button>
        <button type="button" class="btn btn-excluir" (click)="apagar(tut.id)">Excluir</button>
      </div>
    </li>
  </ul>
</div>
